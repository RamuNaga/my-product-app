version: "3.9"

services:
  # ---------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------
  db:
    image: postgres:17
    container_name: myproductapp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hitman
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      mynet: {}
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:7
    container_name: my-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      mynet: {}
    restart: unless-stopped

  # ---------------------------------------------------------
  # Prisma migrations
  # ---------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile.migrate
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - CI=true
    depends_on:
      - db
    restart: "no"
    networks:
      mynet: {}

  # ---------------------------------------------------------
  # Backend Microservices (Built + Run from dist)
  # ---------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile.dev
      args:
        SERVICE: api-gateway
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - CI=true
    ports:
      - "3000:3000"
    volumes:
      - ./libs:/workspace/libs:cached
      - ./nx.json:/workspace/nx.json:ro
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
      - ./eslint.config.js:/workspace/eslint.config.js:ro
      - ./package.json:/workspace/package.json:ro
      - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
      - ./wait-for-it.sh:/workspace/wait-for-it.sh:ro
    depends_on:
      - migrate
    command: >
      sh -c "
      set -e
      echo 'Waiting for Postgres...'
      sh ./wait-for-it.sh db:5432 --timeout=60 --strict
      echo 'Starting API Gateway...'
      node dist/apps/backend/api-gateway/main.js
      "
    networks:
      mynet: {}
    restart: unless-stopped

  bff:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile.dev
      args:
        SERVICE: bff
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - CI=true
    ports:
      - "3002:3002"
    volumes:
      - ./libs:/workspace/libs:cached
      - ./nx.json:/workspace/nx.json:ro
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
      - ./eslint.config.js:/workspace/eslint.config.js:ro
      - ./package.json:/workspace/package.json:ro
      - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
      - ./wait-for-it.sh:/workspace/wait-for-it.sh:ro
    depends_on:
      - migrate
      - api-gateway
    command: >
      sh -c "
      set -e
      echo 'Waiting for Postgres...'
      sh ./wait-for-it.sh db:5432 --timeout=60 --strict
      echo 'Starting BFF...'
      node dist/apps/backend/bff/main.js
      "
    networks:
      mynet: {}
    restart: unless-stopped

  backend-product-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile.dev
      args:
        SERVICE: backend-product-service
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - CI=true
    ports:
      - "3001:3001"
    volumes:
      - ./libs:/workspace/libs:cached
      - ./nx.json:/workspace/nx.json:ro
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
      - ./eslint.config.js:/workspace/eslint.config.js:ro
      - ./package.json:/workspace/package.json:ro
      - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
      - ./wait-for-it.sh:/workspace/wait-for-it.sh:ro
    depends_on:
      - bff
      - db
    command: >
      sh -c "
      set -e
      echo 'Waiting for Postgres...'
      sh ./wait-for-it.sh db:5432 --timeout=60 --strict
      echo 'Starting Product Service...'
      node dist/apps/backend/backend-product-service/main.js
      "
    networks:
      mynet: {}
    restart: unless-stopped

  # ---------------------------
  # Other Microservices
  # ---------------------------
  user-grpc:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile.dev
      args:
        SERVICE: user-grpc
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - CI=true
    ports:
      - "3003:3003"
    volumes:
      - ./libs:/workspace/libs:cached
      - ./nx.json:/workspace/nx.json:ro
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
      - ./eslint.config.js:/workspace/eslint.config.js:ro
      - ./package.json:/workspace/package.json:ro
      - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
      - ./wait-for-it.sh:/workspace/wait-for-it.sh:ro
    depends_on:
      - bff
      - db
    command: >
      sh -c "
      set -e
      echo 'Waiting for Postgres...'
      sh ./wait-for-it.sh db:5432 --timeout=60 --strict
      echo 'Starting User GRPC...'
      node dist/apps/backend/user-grpc/main.js
      "
    networks:
      mynet: {}
    restart: unless-stopped

  company-grpc:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile.dev
      args:
        SERVICE: company-grpc
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - CI=true
    ports:
      - "3004:3004"
    volumes:
      - ./libs:/workspace/libs:cached
      - ./nx.json:/workspace/nx.json:ro
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
      - ./eslint.config.js:/workspace/eslint.config.js:ro
      - ./package.json:/workspace/package.json:ro
      - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
      - ./wait-for-it.sh:/workspace/wait-for-it.sh:ro
    depends_on:
      - bff
      - db
    command: >
      sh -c "
      set -e
      echo 'Waiting for Postgres...'
      sh ./wait-for-it.sh db:5432 --timeout=60 --strict
      echo 'Starting Company GRPC...'
      node dist/apps/backend/company-grpc/main.js
      "
    networks:
      mynet: {}
    restart: unless-stopped

  company-location-grpc:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile.dev
      args:
        SERVICE: company-location-grpc
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - CI=true
    ports:
      - "3005:3005"
    volumes:
      - ./libs:/workspace/libs:cached
      - ./nx.json:/workspace/nx.json:ro
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
      - ./eslint.config.js:/workspace/eslint.config.js:ro
      - ./package.json:/workspace/package.json:ro
      - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
      - ./wait-for-it.sh:/workspace/wait-for-it.sh:ro
    depends_on:
      - bff
      - db
    command: >
      sh -c "
      set -e
      echo 'Waiting for Postgres...'
      sh ./wait-for-it.sh db:5432 --timeout=60 --strict
      echo 'Starting Company Location GRPC...'
      node dist/apps/backend/company-location-grpc/main.js
      "
    networks:
      mynet: {}
    restart: unless-stopped

  workorder-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile.dev
      args:
        SERVICE: workorder-service
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - CI=true
    ports:
      - "3006:3006"
    volumes:
      - ./libs:/workspace/libs:cached
      - ./nx.json:/workspace/nx.json:ro
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
      - ./eslint.config.js:/workspace/eslint.config.js:ro
      - ./package.json:/workspace/package.json:ro
      - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
      - ./wait-for-it.sh:/workspace/wait-for-it.sh:ro
    depends_on:
      - bff
      - db
    command: >
      sh -c "
      set -e
      echo 'Waiting for Postgres...'
      sh ./wait-for-it.sh db:5432 --timeout=60 --strict
      echo 'Starting Workorder Service...'
      node dist/apps/backend/workorder-service/main.js
      "
    networks:
      mynet: {}
    restart: unless-stopped

  # ---------------------------------------------------------
  # Angular Frontend
  # ---------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile.dev
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - CI=true
    ports:
      - "4200:4200"
    volumes:
      - ./apps/frontend:/workspace/apps/frontend:cached
      - ./libs:/workspace/libs:cached
      - ./nx.json:/workspace/nx.json:ro
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
      - ./eslint.config.js:/workspace/eslint.config.js:ro
      - ./package.json:/workspace/package.json:ro
      - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
      - frontend-node-modules:/workspace/apps/frontend/node_modules
      - ./wait-for-it.sh:/workspace/wait-for-it.sh:ro
    depends_on:
      - api-gateway
    command: >
      sh -c "
      set -e
      echo 'Waiting for API Gateway...'
      sh ./wait-for-it.sh api-gateway:3000 --timeout=60 --strict
      echo 'Starting Frontend...'
      pnpm install --frozen-lockfile --prefer-offline &&
      pnpm nx serve frontend --host 0.0.0.0 --port 4200
      "
    networks:
      mynet: {}
    restart: unless-stopped

# ---------------------------------------------------------
# Volumes + Network
# ---------------------------------------------------------
volumes:
  postgres-data:
  frontend-node-modules:

networks:
  mynet:
    driver: bridge