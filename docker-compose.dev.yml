services:
  # =========================================================
  # PostgreSQL
  # =========================================================
  db:
    image: postgres:17
    container_name: myproductapp-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres}
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

    networks:
      mynet: {}

    restart: unless-stopped


  # =========================================================
  # pgAdmin
  # =========================================================
  pgadmin:
    image: dpage/pgadmin4:7
    container_name: my-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "8080:80"

    depends_on:
      db:
        condition: service_healthy

    networks:
      mynet: {}

    restart: unless-stopped


  # =========================================================
  # Prisma migrations
  # =========================================================
  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile.dev
      target: migrate

    working_dir: /workspace

    env_file:
      - .env

    environment:
      CI: "true"

    depends_on:
      db:
        condition: service_healthy

    networks:
      mynet: {}

    restart: "no"


  # =========================================================
  # API Gateway
  # =========================================================
  api-gateway:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile.dev
      target: runtime
      args:
        SERVICE: api-gateway
        SERVICE_DIR: api-gateway

    working_dir: /workspace

    env_file:
      - .env

    environment:
      CI: "true"

    ports:
      - "3000:3000"

    volumes:
      - ./libs:/workspace/libs:cached
      - ./nx.json:/workspace/nx.json:ro
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
      - ./eslint.config.js:/workspace/eslint.config.js:ro
      - ./package.json:/workspace/package.json:ro
      - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
      - ./wait-for-it.sh:/workspace/wait-for-it.sh:ro

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    command:
      - sh
      - -c
      - |
        set -e
        echo "Waiting for Postgres..."
        bash ./wait-for-it.sh db:5432 --timeout=60 --strict
        echo "Starting API Gateway..."
        exec node dist/main.js

    networks:
      mynet: {}

    restart: unless-stopped


  # =========================================================
  # Product Service
