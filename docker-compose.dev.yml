services:
  # ---------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------
  db:
    image: postgres:17
    container_name: myproductapp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hitman
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      mynet: {}

  # ---------------------------------------------------------
  # Prisma migrations
  # ---------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile.dev
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - CI=true
    volumes:
      - ./package.json:/workspace/package.json:ro
      - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
      - ./nx.json:/workspace/nx.json:ro
      - ./eslint.config.js:/workspace/eslint.config.js:ro
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
      - ./libs:/workspace/libs:ro
      - ./wait-for-it.sh:/workspace/wait-for-it.sh:ro
    depends_on:
      - db
    command:
      - sh
      - -c
      - |
        ./wait-for-it.sh db:5432 --timeout=60 --strict -- \
        corepack enable &&
        corepack prepare pnpm@latest --activate &&
        pnpm install --frozen-lockfile --prefer-offline &&
        pnpm prisma migrate deploy --all

    networks:
      mynet: {}

  # ---------------------------------------------------------
  # Backend microservices
  # ---------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile.dev
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - CI=true
    ports:
      - '3000:3000'
    volumes:
      - ./apps/backend/service-name:/workspace/apps/backend/service-name:cached
      - ./libs:/workspace/libs:cached
      - ./nx.json:/workspace/nx.json:ro
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
      - ./eslint.config.js:/workspace/eslint.config.js:ro
      - ./package.json:/workspace/package.json:ro
      - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
      - ./wait-for-it.sh:/workspace/wait-for-it.sh:ro
      - backend-node-modules:/workspace/node_modules
    depends_on:
      - migrate
    command:
      - sh
      - -c
      - |
        ./wait-for-it.sh db:5432 --timeout=60 --strict -- \
        corepack enable &&
        corepack prepare pnpm@latest --activate &&
        pnpm nx serve api-gateway --host 0.0.0.0 --port 3000
    networks:
      mynet: {}

  # Other backend services (bff, backend-product-service, grpc services, workorder-service)
  # They all depend only on api-gateway and migrate (already built), but no need to wait unnecessarily
  bff:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile.dev
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - CI=true
    ports:
      - '3002:3002'
    volumes:
      - ./apps/backend/service-name:/workspace/apps/backend/service-name:cached
      - ./libs:/workspace/libs:cached
      - ./nx.json:/workspace/nx.json:ro
      - ./tsconfig.base.json:/workspace/tsconfig.base.json:ro
      - ./eslint.config.js:/workspace/eslint.config.js:ro
      - ./package.json:/workspace/package.json:ro
      - ./pnpm-lock.yaml:/workspace/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/workspace/pnpm-workspace.yaml:ro
      - ./wait-for-it.sh:/workspace/wait-for-it.sh:ro
      - backend-node-modules:/workspace/node_modules
    depends_on:
      - api-gateway
    command:
      - sh
      - -c
      - |
        corepack enable &&
        corepack prepare pnpm@latest --activate &&
        pnpm nx serve bff --host 0.0.0.0 --port 3002
    networks:
      mynet: {}

  backend-product-service:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile.dev
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - CI=true
    ports:
