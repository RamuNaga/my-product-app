syntax = "proto3";

package product;

import "google/protobuf/wrappers.proto";

message Product {
  int32 id = 1;
  string productCode = 2;
  string name = 3;
  string description = 4;
  string image = 5;
  string productWeight = 6;
  double price = 7;
  int32 companyId = 8;
  string createdAt = 9;
  string updatedAt = 10;
}

message CreateProductRequest {
  string productCode = 1;
  string name = 2;
  string description = 3;
  string image = 4;
  string productWeight = 5;
  double price = 6;
  int32 companyId = 7;
}

message ProductResponse {
  Product product = 1;
}

message EmptyRequest {}

message ProductListResponse {
  repeated Product products = 1;
}

service ProductService {
  rpc CreateProduct (CreateProductRequest) returns (ProductResponse);
  rpc GetProductById (google.protobuf.Int32Value) returns (ProductResponse);
  rpc GetAllProducts (EmptyRequest) returns (ProductListResponse);
}

// --------------------------------------------------
// ITEM MANAGEMENT
// --------------------------------------------------

enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  RAW_MATERIAL = 1;
  PURCHASED_PREPARED = 2;
  MANUFACTURED_COMPONENT = 3;
  SAUCE = 4;
  GARNISH = 5;
  PACKAGING = 6;
  OTHER = 7;
}

enum SupplyType {
  SUPPLY_TYPE_UNSPECIFIED = 0;
  PURCHASED = 1;
  MANUFACTURED = 2;
  BOTH = 3;
}

enum ProcessType {
  PROCESS_TYPE_UNSPECIFIED = 0;
  NONE = 1;
  OVEN = 2;
  STEAM = 3;
  SAUCE_PREPARATION = 4;
  MIXING = 5;
  OTHER_PROCESS = 6;
}

enum UnitOfMeasure {
  UNIT_OF_MEASURE_UNSPECIFIED = 0;
  G = 1;
  KG = 2;
  ML = 3;
  L = 4;
  EACH = 5;
}

message Item {
  int32 id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  ItemKind kind = 5;
  SupplyType supplyType = 6;
  ProcessType processType = 7;
  UnitOfMeasure baseUnit = 8;
  string allergenDeclaration = 9;
  string origin = 10;
  string manufacturer = 11;
  google.protobuf.Int32Value defaultSupplierId = 12;
  string packSizeDescription = 13;
  string netContentDescription = 14;
  bool isActive = 15;
  string createdAt = 16;
  string updatedAt = 17;
}

message CreateItemRequest {
  string name = 1;
  string description = 2;
  ItemKind kind = 3;
  SupplyType supplyType = 4;
  ProcessType processType = 5;
  UnitOfMeasure baseUnit = 6;
  string allergenDeclaration = 7;
  string origin = 8;
  string manufacturer = 9;
  google.protobuf.Int32Value defaultSupplierId = 10;
  string packSizeDescription = 11;
  string netContentDescription = 12;
}

message GetItemByIdRequest {
  int32 id = 1;
}

message ItemResponse {
  Item item = 1;
}

message ItemListResponse {
  repeated Item items = 1;
}

message CreateItemsRequest {
  repeated CreateItemRequest items = 1;
}

message CreateItemsResponse {
  repeated Item items = 1;
}

message UpdateItemRequest {
  int32 id = 1;

  optional string name = 2;
  optional string description = 3;

  optional SupplyType supplyType = 4;
  optional ProcessType processType = 5;
  optional UnitOfMeasure baseUnit = 6;

  optional string allergenDeclaration = 7;
  optional string origin = 8;
  optional string manufacturer = 9;

  google.protobuf.Int32Value defaultSupplierId = 10;

  optional string packSizeDescription = 11;
  optional string netContentDescription = 12;
  bool clearDefaultSupplierId = 13;
}

message ChangeItemActiveStatusRequest {
  int32 id = 1;
}
service ItemService {
  rpc CreateItem (CreateItemRequest) returns (ItemResponse);
  rpc GetItemById (GetItemByIdRequest) returns (ItemResponse);
  rpc GetAllItems (EmptyRequest) returns (ItemListResponse);
  rpc CreateItems(CreateItemsRequest) returns (CreateItemsResponse);
  rpc UpdateItem (UpdateItemRequest) returns (ItemResponse);
  rpc DeactivateItem (ChangeItemActiveStatusRequest) returns (ItemResponse);
  rpc ReactivateItem (ChangeItemActiveStatusRequest) returns (ItemResponse);
}
