# fragments/workorder.graphql

# Base fragment for stage 1 creation
fragment WorkorderBaseFields on Workorder {
  id
  clientLocation
  vendorOrClient
  quantity
  deliveryDate
  description
}

# Full fragment including all details for queries
fragment WorkorderFields on Workorder {
  ...WorkorderBaseFields
  workOrderCode
  status
  priority
  productId
  createdById
  approvedById
  companyId
  attachments
  assignedTo
  comments
  createdAt
  updatedAt
}

# Minimal display for tables/lists
fragment WorkorderListFields on Workorder {
  id
  workOrderCode
  clientLocation
  vendorOrClient
  quantity
  deliveryDate
  status
  priority
  productId
}

# Full details for single workorder view
fragment WorkorderDetailsFields on Workorder {
  ...WorkorderListFields
  description
  productId
  createdById
  approvedById
  companyId
  attachments
  assignedTo
  comments
  createdAt
  updatedAt
}
