<lib-tailwind-host>
  <mat-card class="form-card">
    <mat-tab-group [(selectedIndex)]="selectedTabIndex">
      <mat-tab label="Login">
        @if (loginComponent) {
          <ng-container *ngComponentOutlet="loginComponent"></ng-container>
        }
      </mat-tab>

      <mat-tab label="Sign Up">
        <ng-template #signupStepperHost></ng-template>
      </mat-tab>
    </mat-tab-group>
  </mat-card>
</lib-tailwind-host>
